<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My gallery</h1>
        <p>Discover few of my favourites photographs.</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
    </nav>

    
    <main class="gallery">
        <div class="card">
            <a href="images/alpes.jpg">
                <img src="images/alpes.jpg" alt="Mountains with snow">
            </a>
            <div class="card-content">
                <h2>The Alps</h2>
                <p>A beautiful skiing day in the Alps.</p>
            </div>
        </div>
        <div class="card">
            <a href="images/irlande.jpg">
                <img src="images/irlande.jpg" alt="The Irish landscape">
            </a>
            
            <div class="card-content">
                <h2>Ireland</h2>
                <p>Discover the Irish landscape.</p>
            </div>
        </div>
        <div class="card">
            <a href="images/plage.jpg">
                <img src="images/plage.jpg" alt="The French beach">
            </a>
            <div class="card-content">
                <h2>French beach</h2>
                <p>A beautiful beach in France.</p>
            </div>
        </div>

    </main>


    <footer>
        <p>Created by Guillaume Carré - 2026</p>
    </footer>
</body>
</html>
