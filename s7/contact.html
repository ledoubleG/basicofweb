<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <title>Centria Edu | Contact</title>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">centria <span>edu</span></div>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#topics">Topics</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="gallery-hero">
            <div class="container">
                <span class="label">Contact form</span>
                <h1>Contact</h1>
                <p>Please fill the form if you want to contact us.</p>
                <a href="index.html" class="button">Back to home</a>
            </div>
        </section>
    <section class="topics" id="contact">
        <div class="container">

            <h2>Contact us</h2>

            <p>We offer you this free space to contact us</p>

            <form class="card contact-form"
                action="https://httpbin.org/post"
                method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required><br>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required><br>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"><br>

            <label for="subject">Contact subject</label>
            <select id="subject" name="subject" required>
                <option value="">Choose a subject</option>
                <option value="feedback">Feedback</option>
                <option value="question">Question</option>
                <option value="other">Other</option>
            </select><br>

            <div class="radio-group">
            <label>Preferred contact method:</label>
            <input type="radio" id="contact-email" name="contact_method" value="email">
            <label for="contact-email">Email</label>
            <input type="radio" id="contact-phone" name="contact_method" value="phone">
            <label for="contact-phone">Phone</label><br></div>
            

            <label for="message">Message</label>
            <textarea name="message" id="message" required></textarea><br>

            <button type="submit">Send message</button><br>
            </form>
        </div>
    </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>



</body>
</html>
